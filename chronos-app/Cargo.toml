[package]
name = "chronos-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "chronos-manager"
path = "src/main.rs"

[dependencies]
chronos-common = { path = "../chronos-common" }
chronos-engine = { path = "../chronos-engine" }
slint = { version = "1.18", default-features = false, features = ["compat-1-18", "std", "backend-default", "renderer-software"] }
i-slint-core = { version = "1.18", features = ["image-decoders"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.21"

[build-dependencies]
slint-build = "1.18"
