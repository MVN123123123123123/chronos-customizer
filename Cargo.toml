[workspace]
resolver = "2"
members = [
    "chronos-common",
    "chronos-engine",
    "chronos-daemon",
    "chronos-zygisk",
    "chronos-app",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Chronos Team <dev@chronos.internal>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
