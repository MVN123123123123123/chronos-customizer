[package]
name = "chronos-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "customd"
path = "src/main.rs"

[[bin]]
name = "chronos-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "chronos-deep-test"
path = "src/bin/deep_test.rs"

[dependencies]
chronos-common = { path = "../chronos-common" }
chronos-engine = { path = "../chronos-engine" }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
